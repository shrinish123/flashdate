name: Release
# Builds the package, tests the built wheel on every supported Python, compares
# it with the unmodified dateparser, and only then, if asked to, publishes it.
# Nothing is published unless "publish" is set and "confirm" repeats the version
# in pyproject.toml.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Where to publish, after every check has passed
        type: choice
        options: [nowhere, testpypi, pypi]
        default: nowhere
      confirm:
        description: To publish, type the version in pyproject.toml
        default: ""
permissions:
  contents: read
env:
  # The commit of scrapinghub/dateparser that this version is built from.
  UPSTREAM: ce8c4390dad4629daa2f154e7303052f9d88daec
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Build
        run: |
          pip install -q build==1.6.1 twine==7.0.0
          python -m build --outdir dist
          twine check --strict dist/*
      - name: Check what was built
        id: check
        run: python .github/check_dist.py dist >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: packages, path: dist/, if-no-files-found: error, compression-level: 0 }

  test:
    name: Built package on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: source, persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: packages, path: packages }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "${{ matrix.python-version }}" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q language-pack-fr
      - name: Install the wheel, and take the tests out of the source tree
        run: |
          pip install -q packages/*.whl "pytest>=9" parameterized
          mkdir run && cp -R source/tests source/pyproject.toml run/
      - name: Test suite against the installed package
        working-directory: run
        run: |
          python -c "import flashdate, sys; print(flashdate.__version__, flashdate.__file__); sys.exit('site-packages' not in flashdate.__file__)"
          python -m pytest tests -q -p no:cacheprovider

  compare:
    name: Built package next to the unmodified dateparser
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: source, persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: packages, path: packages }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install -q packages/*.whl freezegun==1.5.5 "dateparser @ git+https://github.com/scrapinghub/dateparser@${UPSTREAM}"
      - name: Compare
        run: |
          mkdir run && cp -R source/tests source/verification run/
          cd run
          python -c "import flashdate, sys; sys.exit('site-packages' not in flashdate.__file__)"
          python verification/compare.py

  publish:
    name: Publish
    needs: [build, test, compare]
    if: inputs.publish != 'nowhere'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.publish }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: The version was typed to confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          [ "$CONFIRM" = "$VERSION" ] || { echo "confirm is '$CONFIRM', the version is '$VERSION': not publishing."; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: packages, path: dist }
      - if: inputs.publish == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with: { repository-url: "https://test.pypi.org/legacy/", print-hash: true }
      - if: inputs.publish == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with: { print-hash: true }
