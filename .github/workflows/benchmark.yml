name: Benchmark
# Times flashdate against the unmodified dateparser on GitHub's standard runners
# and writes the table to the summary of the run. The table in the README is
# copied from a run of this workflow, so anyone can open the run it came from,
# or start one in a fork. Runners are shared machines: each system is measured
# three times, on three machines, to show how much the numbers move.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  # The commit of scrapinghub/dateparser that this version is built from.
  UPSTREAM: ce8c4390dad4629daa2f154e7303052f9d88daec
jobs:
  benchmark:
    name: ${{ matrix.os }}, run ${{ matrix.run }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Install flashdate from this commit, dateparser and dateutil
        run: |
          pip install -q . python-dateutil \
            "dateparser @ git+https://github.com/scrapinghub/dateparser@${UPSTREAM}"
      - name: Processor
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            CPU="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs), $(nproc) cores"
          else
            CPU="$(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) cores"
          fi
          echo "$CPU"
          echo "${{ matrix.os }}, run ${{ matrix.run }}: $CPU" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
      - name: Measure
        # With this shell the step fails if the script does.
        shell: bash
        run: python bench/bench.py --markdown | tee -a "$GITHUB_STEP_SUMMARY"
